works:
  - slug: colonel-blotto
    number: "R-01"
    category: Math & Research
    title: Optimal Solution of Colonel Blotto Game Variant
    tagline: Geometric Analysis & Game-Theoretic Optimization
    summary: >
      We analyzed the Continuous Colonel Blotto Game using geometric and optimization
      techniques to derive the optimal troop allocation conditions. We categorized the
      cases into P-Case, C-Case, and Weighted P-Case, and verified the COBYLA-based
      approximate solutions and existing conjectures.
    takeaway: Game theory research combining geometry and optimization
    role: Research design, mathematical proof, algorithm implementation, experimental analysis
    period: 2025-1
    status: Completed
    tags:
      - Game Theory
      - Optimization
      - Geometry
      - COBYLA
      - Continuous Optimization
      - Mathematics
    links:
      - - Google Drive
        - https://drive.google.com/drive/folders/1y_Cb6BViGLi11OU61dTZjWNlAW7ry84Y
    details:
      - - Goal
        - >
          Sought to analyze how the optimal troop distribution is determined in the
          Continuous Colonel Blotto Game Variant and mathematically verify the
          validity and generalizability of existing guesses.
      - - Process
        - >
          Geometric analysis was performed using Barycentric Coordinate,
          and the geometric probability were derived using dilogarithm and dominated
          convergence theorem. In complex cases, approximate solutions were obtained using
          Rust/Python-based brute force and COBYLA optimization.
      - - Conclusion
        - >
          Derived the geometric probability. The optimal solution for m=3 was derived for C-Case,
          and the COBYLA-based approximate optimal solution was calculated for m=4~6.

  - slug: wythoff
    number: "R-02"
    category: Math & Research
    title: Restricted Variant of Wythoff's Game under mx^n+k
    tagline: The Definition and Analyzation
    summary: A Restricted Variant and Analyzation of Wythoff's Game under mx^n+k
    takeaway: Define and analyze a generalized Wythoff's Game and derive P-position structures through mathematical proof and computational investigation
    role: Game definition, P-position characterization and proof, computational simulation and visualization
    period: 2025-2
    status: Completed
    tags:
      - Wythoff
      - Game Theory
      - Discrete Math
    links: []
    details:
      - - Goal
        - >
          Define a generalized P(x)-Wythoff's Game in which the minimum number of removable stones depends on the size of the other stack,
          and determine the P-position sets for the cases P(x) = x^n + 1 and P(x) = nx + k.
      - - Process
        - >
          The P(x)-Wythoff's Game was defined and its correspondence with rook movements on a chessboard was established.
          P-position sets were then constructed and proved using functions and set definitions.
          For x^n + 1, the P-position structure was generalized for n > 1, while for nx + k, the P-position was determined for 1 ≤ k ≤ n.
          Computational simulations were additionally used to investigate and visualize the P-positions and to formulate conjectures for k > n.
      - - Conclusion
        - >
          The P-position sets were completely characterized for x^n + 1 (n > 1) and nx + k (1 ≤ k ≤ n).
          The boundary of the P-position region for x^n + 1 was shown to be closely related to
          y = x^n + √[n]{x}, while computational experiments for k > n led to several conjectures
          concerning the structure and periodic behavior of the P-position set.

  - slug: gravity-transform
    number: "R-03"
    category: Math & Research
    title: Gravity Transformations on Regular n-Polygon-Based Lattices
    tagline: The Definition and Periodicity
    summary: The study on the Definition and Periodicity of Gravity Transformations on Regular n-Polygon-Based Lattices
    takeaway: Design and prove an independent mathematical model combining geometry and group theory
    role: Grid definition, theorem proof, algorithm and visualization implementation
    period: 2026-1
    status: Completed
    tags:
      - Geometry
      - Group Theory
      - D_n
      - Dynamical Systems
      - Mathematics
    links:
      - - Google Drive
        - https://drive.google.com/drive/folders/1o6csVjGBHo8HNyxLqE2fsg81Pk0cDead
    details:
      - - Goal
        - >
          Formulate dynamical gravity transformations across regular n-polygonal lattice graphs, analyzing limit orbits and invariants under geometric reflection groups.
      - - Process
        - >
          The regular polygonal lattice and the gravity transformation for regular polygonal lattice were defined,
          and the trajectory, symmetry structure that appeared during the transformation process were analyzed
          using coordinate geometry and the dihedral group (D_n).
      - - Conclusion
        - >
          We mathematically proved the periodicity and symmetry of the transformation, built
          related theorems and algorithms, and presented a theory that can be extended to
          general n-gonal lattices.

